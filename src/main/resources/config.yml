# ------------------------------------------------------------------
# HardcoreSpawn configuration
# ------------------------------------------------------------------

# Config schema version. If your config is older than the plugin's, it is
# backed up to config.yml.bak on startup: your settings carry over, but the
# messages section and the quest bands are refreshed to the new format.
# Never change this yourself.
config-version: 8

# Seconds allowed per quest. Flat forever — difficulty comes from the quests.
quest-time-seconds: 300
quest-complete-bonus-seconds: 300

# Sidebar scoreboard shown during a run: every active quest with its progress.
hud:
  sidebar:
    enabled: true   # set false if another plugin owns the sidebar
    title: "§6§lHARDCORE §r§7Lv {level}"

# Every N completed quests grants a random mob spawn egg (0 disables).
milestone-egg-every: 30

# Every N completed quests grants an (empty) mob spawner block (0 disables).
# Right-click it with a spawn egg to choose what it spawns.
milestone-spawner-every: 60

# How quest amounts scale per level: amount = base * growth^(level-1)
difficulty-growth: 1.3

# From this level on, quests combine two objectives.
multi-objective-min-level: 13

# Disconnect handling: the quest clock keeps ticking while offline.
# Rejoin within the grace period to resume; after it, the run is dead.
disconnect-grace-seconds: 60

# Discord webhook URL for run notifications (run started, quest completed,
# run ended). Empty disables. Paste your webhook URL here to enable.
discord-webhook-url: ""

# Starting a run requires being far from the overworld center (anti-farming),
# unless the player's inventory (including armor and offhand) AND ender
# chest are both completely empty. Outside the overworld the distance rule
# cannot be satisfied, so only fully empty players may start there.
start:
  min-distance: 2000.0   # XZ blocks from the center required to start with items
  center-x: 0.0
  center-z: 0.0
  # Anti-combat-escape: /hardcore confirm starts a stand-still countdown
  # instead of starting instantly (starting teleports you to spawn). Take no
  # damage and don't move for the whole window, or the start is cancelled.
  # 0 disables the freeze (runs start instantly, as before).
  freeze-seconds: 10

# What happens when the quest timer runs out: escalating damage, then death.
timeout:
  damage: 1.0            # half a heart per tick
  interval-seconds: 10
  kill-after-seconds: 30 # total damage phase before death

# While a run is active, every command except /hardcore and /hardcoreadmin is
# blocked (deny by default): no teleports, homes, warps, or impostor commands.

# ------------------------------------------------------------------
# Quest bands. Each band covers a level range and holds quest templates.
# Template fields:
#   id          unique within the band (used for no-repeat logic)
#   type        BREAK | CRAFT | SMELT | KILL | OBTAIN | TRAVEL
#   target      Material name (BREAK/CRAFT/SMELT/OBTAIN), EntityType (KILL),
#               or anything (TRAVEL ignores it; convention is BLOCKS)
#   base-amount amount at level 1, scaled by difficulty-growth per level
#   description shown to the player; {amount} and {target} are replaced
# ------------------------------------------------------------------
bands:
  - min-level: 1
    max-level: 3
    quests:
      # --- wood: every species, not just oak ---
      - { id: chop_oak,      type: BREAK, target: OAK_LOG,      base-amount: 24, description: "Chop {amount} oak logs" }
      - { id: chop_birch,    type: BREAK, target: BIRCH_LOG,    base-amount: 24, description: "Chop {amount} birch logs" }
      - { id: chop_spruce,   type: BREAK, target: SPRUCE_LOG,   base-amount: 24, description: "Chop {amount} spruce logs" }
      - { id: chop_jungle,   type: BREAK, target: JUNGLE_LOG,   base-amount: 24, description: "Chop {amount} jungle logs" }
      - { id: chop_acacia,   type: BREAK, target: ACACIA_LOG,   base-amount: 24, description: "Chop {amount} acacia logs" }
      - { id: chop_dark_oak, type: BREAK, target: DARK_OAK_LOG, base-amount: 24, description: "Chop {amount} dark oak logs" }
      - { id: chop_cherry,   type: BREAK, target: CHERRY_LOG,   base-amount: 24, description: "Chop {amount} cherry logs" }
      - { id: chop_mangrove, type: BREAK, target: MANGROVE_LOG, base-amount: 24, description: "Chop {amount} mangrove logs" }
      # --- stone: not just cobblestone ---
      - { id: mine_stone,    type: BREAK, target: STONE,        base-amount: 32, description: "Mine {amount} stone" }
      - { id: mine_cobble,   type: BREAK, target: COBBLESTONE,  base-amount: 32, description: "Mine {amount} cobblestone" }
      - { id: mine_andesite, type: BREAK, target: ANDESITE,     base-amount: 32, description: "Mine {amount} andesite" }
      - { id: mine_granite,  type: BREAK, target: GRANITE,      base-amount: 32, description: "Mine {amount} granite" }
      - { id: mine_diorite,  type: BREAK, target: DIORITE,      base-amount: 32, description: "Mine {amount} diorite" }
      - { id: mine_deepslate,type: BREAK, target: DEEPSLATE,     base-amount: 32, description: "Mine {amount} deepslate" }
      - { id: mine_tuff,     type: BREAK, target: TUFF,         base-amount: 32, description: "Mine {amount} tuff" }
      # --- ores & dirt ---
      - { id: mine_coal,     type: BREAK, target: COAL_ORE,     base-amount: 12, description: "Mine {amount} coal ore" }
      - { id: mine_copper,   type: BREAK, target: COPPER_ORE,   base-amount: 12, description: "Mine {amount} copper ore" }
      - { id: dig_dirt,      type: BREAK, target: DIRT,         base-amount: 48, description: "Dig {amount} dirt" }
      - { id: dig_gravel,    type: BREAK, target: GRAVEL,       base-amount: 48, description: "Dig {amount} gravel" }
      - { id: dig_sand,      type: BREAK, target: SAND,         base-amount: 48, description: "Dig {amount} sand" }
      # --- easy crafting ---
      - { id: craft_planks,  type: CRAFT, target: OAK_PLANKS,   base-amount: 48, description: "Craft {amount} oak planks" }
      - { id: craft_sticks,  type: CRAFT, target: STICK,        base-amount: 32, description: "Craft {amount} sticks" }
      - { id: craft_torches, type: CRAFT, target: TORCH,        base-amount: 24, description: "Craft {amount} torches" }
      - { id: craft_table,   type: CRAFT, target: CRAFTING_TABLE, base-amount: 2, description: "Craft {amount} crafting tables" }
      # --- light combat ---
      - { id: kill_zombie,   type: KILL,  target: ZOMBIE,       base-amount: 6,  description: "Slay {amount} zombies" }
      - { id: kill_spider,   type: KILL,  target: SPIDER,       base-amount: 6,  description: "Slay {amount} spiders" }
      # --- travel (also the guaranteed opening quest) ---
      - { id: hike_500,      type: TRAVEL, target: BLOCKS,      base-amount: 500, description: "Travel {amount} blocks on foot" }
  - min-level: 4
    max-level: 6
    quests:
      - { id: smelt_iron,  type: SMELT, target: IRON_INGOT,  base-amount: 8,  description: "Smelt {amount} iron ingots" }
      - { id: smelt_copper,type: SMELT, target: COPPER_INGOT,base-amount: 8,  description: "Smelt {amount} copper ingots" }
      - { id: mine_iron,   type: BREAK, target: IRON_ORE,    base-amount: 12, description: "Mine {amount} iron ore" }
      - { id: mine_gold,   type: BREAK, target: GOLD_ORE,    base-amount: 10, description: "Mine {amount} gold ore" }
      - { id: mine_lapis,  type: BREAK, target: LAPIS_ORE,   base-amount: 10, description: "Mine {amount} lapis ore" }
      - { id: mine_redstone,type: BREAK, target: REDSTONE_ORE,base-amount: 10, description: "Mine {amount} redstone ore" }
      - { id: kill_zombie, type: KILL,  target: ZOMBIE,      base-amount: 6,  description: "Slay {amount} zombies" }
      - { id: kill_skeleton_small, type: KILL, target: SKELETON, base-amount: 4, description: "Slay {amount} skeletons" }
      - { id: get_leather, type: OBTAIN,target: LEATHER,     base-amount: 8,  description: "Hold {amount} leather at once" }
      - { id: craft_bread, type: CRAFT, target: BREAD,       base-amount: 8,  description: "Bake {amount} bread" }
      - { id: craft_furnace,type: CRAFT,target: FURNACE,     base-amount: 2,  description: "Craft {amount} furnaces" }
      - { id: craft_iron_pick, type: CRAFT, target: IRON_PICKAXE, base-amount: 1, description: "Craft {amount} iron pickaxes" }
  - min-level: 7
    max-level: 9
    quests:
      - { id: kill_skeleton, type: KILL,  target: SKELETON,  base-amount: 6,  description: "Slay {amount} skeletons" }
      - { id: get_diamonds,  type: OBTAIN,target: DIAMOND,   base-amount: 5,  description: "Hold {amount} diamonds at once" }
      - { id: mine_obsidian, type: BREAK, target: OBSIDIAN,  base-amount: 12, description: "Mine {amount} obsidian" }
      - { id: smelt_gold,    type: SMELT, target: GOLD_INGOT,base-amount: 8,  description: "Smelt {amount} gold ingots" }
      - { id: kill_creeper,  type: KILL,  target: CREEPER,    base-amount: 6,  description: "Slay {amount} creepers" }
  - min-level: 10
    max-level: 12
    quests:
      - { id: get_blaze_rods, type: OBTAIN, target: BLAZE_ROD, base-amount: 6, description: "Hold {amount} blaze rods at once" }
      - { id: mine_quartz,    type: BREAK,  target: NETHER_QUARTZ_ORE, base-amount: 24, description: "Mine {amount} nether quartz ore" }
      - { id: kill_blaze,     type: KILL,   target: BLAZE,    base-amount: 6,  description: "Slay {amount} blazes" }
      - { id: get_ghast_tears,type: OBTAIN, target: GHAST_TEAR, base-amount: 2, description: "Hold {amount} ghast tears at once" }
  - min-level: 13
    max-level: 999999
    quests:
      - { id: get_netherite,  type: OBTAIN, target: NETHERITE_SCRAP, base-amount: 3, description: "Hold {amount} netherite scrap at once" }
      - { id: get_skulls,     type: OBTAIN, target: WITHER_SKELETON_SKULL, base-amount: 2, description: "Hold {amount} wither skeleton skulls at once" }
      - { id: kill_wither_skel,type: KILL,  target: WITHER_SKELETON, base-amount: 8, description: "Slay {amount} wither skeletons" }
      - { id: mine_debris,    type: BREAK,  target: ANCIENT_DEBRIS, base-amount: 6, description: "Mine {amount} ancient debris" }
      - { id: craft_netherite, type: CRAFT, target: NETHERITE_INGOT, base-amount: 2, description: "Craft {amount} netherite ingots" }

