  confirm-expired: "§cYour hardcore request expired. Type /hardcore to try again."
  start-denied-too-close: "§cTravel at least {radius} blocks from ({center-x}, {center-z}), or empty your inventory and ender chest first."
  already-running: "§cYou are already in a hardcore run!"
  teleport-failed: "§cCould not teleport you to spawn. Run cancelled — your inventory was restored."
  confirm-freeze-start: "§eStand still for {seconds} seconds! Take no damage and your run will begin."
  confirm-freeze-title: "§c§l{seconds}"
