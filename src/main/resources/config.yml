# ------------------------------------------------------------------
# HardcoreSpawn configuration
# ------------------------------------------------------------------

# Config schema version. If your config is older than the plugin's, it is
# backed up to config.yml.bak on startup: your settings carry over, but the
# messages section is refreshed to the new format. Never change this yourself.
config-version: 1

# Seconds allowed per quest. Flat forever — difficulty comes from the quests.
quest-time-seconds: 300

# Every N completed quests grants a random mob spawn egg (0 disables).
milestone-egg-every: 30

# How quest amounts scale per level: amount = base * growth^(level-1)
difficulty-growth: 1.3

# From this level on, quests combine two objectives.
multi-objective-min-level: 13

# Disconnect handling: the quest clock keeps ticking while offline.
# Rejoin within the grace period to resume; after it, the run is dead.
disconnect-grace-seconds: 60

# Starting a run requires being far from the overworld center (anti-farming),
# unless the player's inventory (including armor and offhand) AND ender
# chest are both completely empty. Outside the overworld the distance rule
# cannot be satisfied, so only fully empty players may start there.
start:
  min-distance: 2000.0   # XZ blocks from the center required to start with items
  center-x: 0.0
  center-z: 0.0
  # Anti-combat-escape: /hardcore confirm starts a stand-still countdown
  # instead of starting instantly (starting teleports you to spawn). Take no
  # damage and don't move for the whole window, or the start is cancelled.
  # 0 disables the freeze (runs start instantly, as before).
  freeze-seconds: 10

# What happens when the quest timer runs out: escalating damage, then death.
timeout:
  damage: 1.0            # half a heart per tick
  interval-seconds: 10
  kill-after-seconds: 30 # total damage phase before death

# While a run is active, every command except /hardcore and /hardcoreadmin is
# blocked (deny by default): no teleports, homes, warps, or impostor commands.

# ------------------------------------------------------------------
# Quest bands. Each band covers a level range and holds quest templates.
# Template fields:
#   id          unique within the band (used for no-repeat logic)
#   type        BREAK | CRAFT | SMELT | KILL | OBTAIN
#   target      Material name (BREAK/CRAFT/SMELT/OBTAIN) or EntityType (KILL)
#   base-amount amount at level 1, scaled by difficulty-growth per level
#   description shown to the player; {amount} and {target} are replaced
# ------------------------------------------------------------------
bands:
  - min-level: 1
    max-level: 3
    quests:
      - { id: chop_logs,   type: BREAK, target: OAK_LOG,     base-amount: 32, description: "Chop {amount} oak logs" }
      - { id: mine_cobble, type: BREAK, target: COBBLESTONE, base-amount: 48, description: "Mine {amount} cobblestone" }
      - { id: mine_coal,   type: BREAK, target: COAL_ORE,    base-amount: 16, description: "Mine {amount} coal ore" }
      - { id: dig_dirt,    type: BREAK, target: DIRT,        base-amount: 64, description: "Dig {amount} dirt" }
      - { id: craft_planks,type: CRAFT, target: OAK_PLANKS,  base-amount: 64, description: "Craft {amount} oak planks" }
  - min-level: 4
    max-level: 6
    quests:
      - { id: smelt_iron,  type: SMELT, target: IRON_INGOT,  base-amount: 10, description: "Smelt {amount} iron ingots" }
      - { id: mine_iron,   type: BREAK, target: IRON_ORE,    base-amount: 16, description: "Mine {amount} iron ore" }
      - { id: kill_zombie, type: KILL,  target: ZOMBIE,      base-amount: 8,  description: "Slay {amount} zombies" }
      - { id: craft_furnace,type: CRAFT,target: FURNACE,     base-amount: 2,  description: "Craft {amount} furnaces" }
      - { id: craft_iron_pick, type: CRAFT, target: IRON_PICKAXE, base-amount: 1, description: "Craft {amount} iron pickaxes" }
  - min-level: 7
    max-level: 9
    quests:
      - { id: kill_skeleton, type: KILL,  target: SKELETON,  base-amount: 6,  description: "Slay {amount} skeletons" }
      - { id: get_diamonds,  type: OBTAIN,target: DIAMOND,   base-amount: 5,  description: "Hold {amount} diamonds at once" }
      - { id: mine_obsidian, type: BREAK, target: OBSIDIAN,  base-amount: 12, description: "Mine {amount} obsidian" }
      - { id: smelt_gold,    type: SMELT, target: GOLD_INGOT,base-amount: 8,  description: "Smelt {amount} gold ingots" }
      - { id: kill_creeper,  type: KILL,  target: CREEPER,    base-amount: 6,  description: "Slay {amount} creepers" }
  - min-level: 10
    max-level: 12
    quests:
      - { id: get_blaze_rods, type: OBTAIN, target: BLAZE_ROD, base-amount: 6, description: "Hold {amount} blaze rods at once" }
      - { id: mine_quartz,    type: BREAK,  target: NETHER_QUARTZ_ORE, base-amount: 24, description: "Mine {amount} nether quartz ore" }
      - { id: kill_blaze,     type: KILL,   target: BLAZE,    base-amount: 6,  description: "Slay {amount} blazes" }
      - { id: get_ghast_tears,type: OBTAIN, target: GHAST_TEAR, base-amount: 2, description: "Hold {amount} ghast tears at once" }
  - min-level: 13
    max-level: 999999
    quests:
      - { id: get_netherite,  type: OBTAIN, target: NETHERITE_SCRAP, base-amount: 3, description: "Hold {amount} netherite scrap at once" }
      - { id: get_skulls,     type: OBTAIN, target: WITHER_SKELETON_SKULL, base-amount: 2, description: "Hold {amount} wither skeleton skulls at once" }
      - { id: kill_wither_skel,type: KILL,  target: WITHER_SKELETON, base-amount: 8, description: "Slay {amount} wither skeletons" }
      - { id: mine_debris,    type: BREAK,  target: ANCIENT_DEBRIS, base-amount: 6, description: "Mine {amount} ancient debris" }
      - { id: craft_netherite, type: CRAFT, target: NETHERITE_INGOT, base-amount: 2, description: "Craft {amount} netherite ingots" }

